name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    env:
      # Einige Tests erwarten Datumsangaben in deutscher Zeit; der Runner läuft auf UTC.
      TZ: Europe/Berlin
    defaults:
      run:
        working-directory: ScanToMe
    steps:
      - uses: actions/checkout@v7
      # Neueste installierte Xcode-Version ohne Beta; Scan to me braucht das SDK von macOS 27.
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      # Die Live-Tests (Scanner, Claude, Apple-Modell) überspringen sich ohne ihre Umgebungsvariablen.
      - name: Run tests
        run: swift test
